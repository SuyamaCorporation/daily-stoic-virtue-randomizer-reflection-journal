<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストア哲学・朝の黙想ジャーナル</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen">
<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-amber-300 mb-1" style="font-family:Georgia,serif;">ストア哲学 朝の黙想</h1>
  <p class="text-center text-stone-500 mb-5 text-sm">知恵・勇気・正義・節制 — 四徳からの問い</p>

  <!-- Today's virtue -->
  <div class="bg-stone-900 rounded-2xl p-6 mb-5 text-center relative overflow-hidden">
    <div id="virtue-badge" class="inline-block px-3 py-1 rounded-full text-xs font-semibold mb-3"></div>
    <div id="quote-text" class="text-lg leading-relaxed mb-3" style="font-family:Georgia,serif;"></div>
    <div id="quote-source" class="text-xs text-stone-500 mb-3"></div>
    <div id="question" class="text-sm text-amber-200/80 italic bg-stone-800/60 rounded-xl px-4 py-3"></div>
    <button onclick="drawQuote()" class="mt-4 px-4 py-2 bg-stone-700 hover:bg-stone-600 text-stone-200 text-sm rounded-lg" aria-label="別の格言を引く">🎲 別の格言を引く</button>
  </div>

  <!-- Journal -->
  <div class="bg-stone-900 rounded-2xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-stone-300 mb-2" style="font-family:Georgia,serif;">今日の黙想</h2>
    <textarea id="journal-text" rows="5" class="w-full bg-stone-800 border border-stone-600 rounded-xl p-3 text-sm text-stone-100 resize-none focus:outline-none focus:border-amber-700" placeholder="今日の問いに答えてみてください...今感じていること、気づいたことを自由に書き留めましょう。" aria-label="黙想を書く"></textarea>
    <button onclick="saveEntry()" class="mt-2 w-full bg-amber-800 hover:bg-amber-700 text-amber-100 py-2 rounded-lg text-sm font-semibold" aria-label="保存する">📜 保存する</button>
  </div>

  <!-- Virtue selector -->
  <div class="bg-stone-900 rounded-2xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-stone-300 mb-3">ストア四徳を探求する</h2>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="filterVirtue('wisdom')" class="bg-blue-900/50 hover:bg-blue-800/50 text-blue-200 py-3 rounded-xl text-sm" aria-label="知恵">🦉 知恵（Sophia）<br><span class="text-xs opacity-70">何が善か・悪かを知る力</span></button>
      <button onclick="filterVirtue('courage')" class="bg-red-900/50 hover:bg-red-800/50 text-red-200 py-3 rounded-xl text-sm" aria-label="勇気">⚔️ 勇気（Andreia）<br><span class="text-xs opacity-70">恐れに立ち向かう意志</span></button>
      <button onclick="filterVirtue('justice')" class="bg-green-900/50 hover:bg-green-800/50 text-green-200 py-3 rounded-xl text-sm" aria-label="正義">⚖️ 正義（Dikaiosyne）<br><span class="text-xs opacity-70">他者と世界への公正</span></button>
      <button onclick="filterVirtue('temperance')" class="bg-purple-900/50 hover:bg-purple-800/50 text-purple-200 py-3 rounded-xl text-sm" aria-label="節制">🏛️ 節制（Sophrosyne）<br><span class="text-xs opacity-70">欲望・感情を整える力</span></button>
    </div>
  </div>

  <!-- Saved entries -->
  <div id="entries-section" class="hidden">
    <h2 class="text-sm font-semibold text-stone-400 mb-2">黙想記録</h2>
    <div id="entries-list" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
    <button onclick="clearEntries()" class="mt-1 text-xs text-stone-600 hover:text-stone-400" aria-label="全削除">全削除</button>
  </div>
</div>

<script>
const quotes = {
  wisdom: [
    { text: '自分の力が及ぶことと、及ばないことを区別せよ。及ぶことだけに集中することが知恵の始まりだ。', source: 'エピクテトス — エンキリディオン I', q: '今日、あなたが本当にコントロールできることは何ですか？' },
    { text: '知恵ある者は、悪事から身を守ることより、悪事を犯したいという欲望から身を守ることに努める。', source: 'セネカ — 書簡集', q: '最近、知恵で避けられたはずの失敗がありましたか？' },
    { text: 'われわれは、事物そのものによってではなく、事物に関する意見によって悩まされる。', source: 'エピクテトス', q: '今日悩んでいることは、現実ですか？それとも意見ですか？' },
    { text: '多くを学ぶより、一つのことをよく知れ。', source: 'マルクス・アウレリウス — 自省録 IV', q: '今最も深く理解したい「一つのこと」は何ですか？' },
  ],
  courage: [
    { text: '最も多く失うのは、一番恐れている者だ。', source: 'セネカ — 書簡集 IV', q: '今日、あなたが最も恐れていることは何ですか？その恐れは理性的ですか？' },
    { text: '嵐の中に美しさを見出せる者は、どんな天気にも幸福でいられる。', source: 'セネカ', q: '今直面している「嵐」の中に、何か学べることはありますか？' },
    { text: '不安は明日の心配を消してくれない。今日の力を奪うだけだ。', source: 'セネカ', q: '今日の不安は、明日の何かを変えられますか？' },
    { text: '勇気とは、恐れがないことではない。恐れながらも進むことだ。', source: 'マルクス・アウレリウス', q: '今日、恐れながらも踏み出すとしたら、何をしますか？' },
  ],
  justice: [
    { text: 'われわれは社会のために生まれた。したがって、社会のために生きよ。', source: 'マルクス・アウレリウス — 自省録 IX', q: '今日、あなたの行動は社会や周囲の人のためになりましたか？' },
    { text: '他者を傷つける最も確実な方法は、彼らを道具として扱うことだ。', source: 'マルクス・アウレリウス', q: '最近、誰かを目的のための手段として扱ってしまいましたか？' },
    { text: '不正義の目撃者であることは、不正義に加担することと同じだ。', source: 'マルクス・アウレリウス', q: '今日、あなたが声を上げるべき場面はありましたか？' },
  ],
  temperance: [
    { text: 'もし今すぐ必要でないなら、今すぐ欲しがらなくていい。', source: 'エピクテトス', q: '今日、何か不必要なものを欲しがりましたか？それはなぜですか？' },
    { text: '贅沢は善人を腐らせ、悪人に力を与える。', source: 'セネカ', q: '最近、節制の欠如があなたにどんな影響を与えましたか？' },
    { text: '自分の欲求を満たすことより、欲求を必要最小限にすることを学べ。', source: 'エピクテトス', q: '今日、満たさなくても良かった欲求は何でしたか？' },
    { text: '静寂の中に宿る平和は、外の騒音には征服されない。', source: 'マルクス・アウレリウス', q: '今日、心を静めた瞬間はありましたか？' },
  ],
};

const virtueColors = {
  wisdom: { badge:'bg-blue-900 text-blue-200', border:'border-blue-800', name:'知恵' },
  courage: { badge:'bg-red-900 text-red-200', border:'border-red-800', name:'勇気' },
  justice: { badge:'bg-green-900 text-green-200', border:'border-green-800', name:'正義' },
  temperance: { badge:'bg-purple-900 text-purple-200', border:'border-purple-800', name:'節制' },
};

let currentVirtue = 'wisdom';

function drawQuote(virtue) {
  const v = virtue || currentVirtue || ['wisdom','courage','justice','temperance'][Math.floor(Math.random()*4)];
  currentVirtue = v;
  const list = quotes[v];
  const q = list[Math.floor(Math.random()*list.length)];
  const vc = virtueColors[v];
  document.getElementById('virtue-badge').className = 'inline-block px-3 py-1 rounded-full text-xs font-semibold mb-3 ' + vc.badge;
  document.getElementById('virtue-badge').textContent = vc.name;
  document.getElementById('quote-text').textContent = '「' + q.text + '」';
  document.getElementById('quote-source').textContent = '— ' + q.source;
  document.getElementById('question').textContent = '📖 問い: ' + q.q;
}

function filterVirtue(v) {
  drawQuote(v);
}

function saveEntry() {
  const text = document.getElementById('journal-text').value.trim();
  if (!text) return;
  const entries = JSON.parse(localStorage.getItem('stoic-journal')||'[]');
  const badge = document.getElementById('virtue-badge').textContent;
  const quote = document.getElementById('quote-text').textContent;
  entries.unshift({
    date: new Date().toLocaleString('ja-JP'),
    virtue: badge,
    quote: quote.substring(0,40) + '...',
    text,
  });
  localStorage.setItem('stoic-journal', JSON.stringify(entries.slice(0,50)));
  document.getElementById('journal-text').value = '';
  renderEntries();
}

function renderEntries() {
  const entries = JSON.parse(localStorage.getItem('stoic-journal')||'[]');
  if (entries.length === 0) { document.getElementById('entries-section').classList.add('hidden'); return; }
  document.getElementById('entries-section').classList.remove('hidden');
  document.getElementById('entries-list').innerHTML = entries.slice(0,10).map(e => `
    <div class="bg-stone-900 rounded-xl p-3">
      <div class="flex gap-2 items-center mb-1">
        <span class="text-xs text-stone-500">${e.date}</span>
        <span class="text-xs bg-stone-800 text-amber-400 px-2 py-0.5 rounded">${e.virtue}</span>
      </div>
      <div class="text-xs text-stone-500 mb-1 italic">${e.quote}</div>
      <div class="text-sm text-stone-300">${e.text.substring(0,100)}${e.text.length>100?'...':''}</div>
    </div>
  `).join('');
}

function clearEntries() {
  if (!confirm('全記録を削除しますか？')) return;
  localStorage.removeItem('stoic-journal');
  renderEntries();
}

drawQuote();
renderEntries();
</script>
</body>
</html>
